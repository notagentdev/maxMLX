[build-system]
# Pure Python: MLX ships its own Metal kernels, so there is nothing to compile.
# setuptools floor: 77 is the first release that understands the PEP 639 `license`
# SPDX string and `license-files` below.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# maxMLX: an independent fork of FlashML's FreeToken. The distribution and
# branding are maxmlx; the module layout follows upstream FreeToken's so
# diffs against it remain readable.
name = "maxmlx"
# Single source of truth: python/maxmlx/version.py (read via the attr directive below).
dynamic = ["version"]
description = "Serve MoE models bigger than your memory on Apple silicon — elastic expert offload, OpenAI- and Anthropic-compatible APIs, built-in web console"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "notagentdev" }]
# No License:: classifier: setuptools>=77 rejects mixing one with the SPDX string above.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Version ranges are floor=last-verified, ceiling=next-major (kept loose enough to
# resolve, tight enough to bar a silent breaking bump). These ranges are the contract;
# there is no lockfile.
dependencies = [
    "fastapi>=0.115,<1",
    "huggingface_hub>=1.19,<2",
    "mlx>=0.30",
    "mlx-lm>=0.31,<1",
    "msgpack>=1.1,<2",
    "numpy>=2.0",
    "openai>=2.0,<3",
    "partial-json-parser>=0.2,<1",
    "prompt_toolkit>=3.0,<4",
    "pydantic>=2.9,<3",
    "pyzmq>=27,<28",
    "safetensors>=0.6,<1",
    "tqdm>=4.66,<5",
    "transformers>=5.5,<6",
    "uvicorn>=0.30,<1",
]

[project.urls]
Homepage = "https://github.com/notagentdev/maxMLX"
Repository = "https://github.com/notagentdev/maxMLX"
Issues = "https://github.com/notagentdev/maxMLX/issues"
Changelog = "https://github.com/notagentdev/maxMLX/blob/main/CHANGELOG.md"
Upstream = "https://github.com/FlashML-org/FreeToken"

[project.scripts]
mt = "maxmlx.cli:main"
maxmlx = "maxmlx.cli:main"
# The pre-rename command name.
maxtoken = "maxmlx.cli:main"

[project.optional-dependencies]
dev = ["pytest>=6.0"]
modelscope = ["modelscope>=1.10.0"]
# Structured output (response_format json_object/json_schema) on the MLX backend.
# Pinned to the pair oMLX validated: xgrammar 0.2.3 crashes at import with
# apache-tvm-ffi 0.1.13 on macOS arm64. Needs torch at import time.
grammar = ["xgrammar==0.2.3", "apache-tvm-ffi==0.1.11"]
# Image generation in the chat and /v1/images/generations (FLUX.2 Klein via mflux).
# mflux needs torch>=2.13; nothing else in the engine pins torch.
images = ["mflux==0.21.0"]
# Video generation in the chat (LTX-2.x via ltx-2-mlx, MIT; not on PyPI, pinned to a commit).
videos = [
    "ltx-core-mlx @ git+https://github.com/dgrauet/ltx-2-mlx@75c463e#subdirectory=packages/ltx-core-mlx",
    "ltx-pipelines-mlx @ git+https://github.com/dgrauet/ltx-2-mlx@75c463e#subdirectory=packages/ltx-pipelines-mlx",
]

[tool.setuptools]
include-package-data = true
package-dir = {"" = "python"}

[tool.setuptools.dynamic]
version = {attr = "maxmlx.version.__version__"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
"*" = ["server/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "slow: takes tens of seconds (big kernel sweeps, real-checkpoint reads); deselect with -m 'not slow'",
    "needs_weights: needs a real local checkpoint, gated behind an env var (see tests/README.md)",
]
